id: IMPACT-MCP-SDK-ADOPTION-001
version: 1.0.0
date: 2026-08-06
status: accepted
authority: Repository Owner explicit instruction; reverses ADR-019 under the exact condition ADR-019 §6 named for revisiting it
change:
  title: Adopt @modelcontextprotocol/sdk for both local stdio and remote Streamable HTTP MCP transports, replacing the ADR-019 hand-rolled implementation
  supersedes: []
  preserves:
    - ADR-016's authoritative execution path (Host -> Host Integration Package -> QA Intelligence MCP Interface -> Agent Runtime/Evaluation Engine)
    - ADR-016 §4's seam rule (transport never calls a Skill implementation or persistence directly)
    - ADR-016 §6 (MCP as an untrusted transport adapter relative to domain authority)
    - the existing domain seam unchanged in responsibility (AgentRuntimeToolRegistry, OidcBearerAuthenticator, OauthCallbackServer's handoff to OidcWorkspaceContextIssuer)
    - wire-level MCP protocol compatibility with every existing Host Integration Package
  corrects:
    - ADR-019's "no @modelcontextprotocol/sdk" decision, under the exact condition ADR-019 §6 itself named as sufficient grounds to revisit it (remote transport and OAuth reaching real consumers, which ADR-020's work has now done)
affected_artifacts:
  decisions: [ADR-023]
  specifications: [SPEC-503, SPEC-508, SPEC-509, SPEC-510]
  implementation:
    - replaces src/mcp/jsonrpc.ts, src/mcp/protocol.ts, src/mcp/mcp-server.ts, src/mcp/stdio-transport.ts, src/mcp/remote/streamable-http-transport.ts (not yet migrated)
    - new package.json dependency @modelcontextprotocol/sdk
risks_and_controls:
  - risk: migrating the transport silently changes domain seam behavior (authorization, idempotency, deadlines)
    control: ADR-023 §4 explicitly keeps AgentRuntimeToolRegistry/OidcBearerAuthenticator/OauthCallbackServer unchanged in responsibility; only the transport layer below them changes
  - risk: a host that worked against the hand-rolled transport breaks against the SDK-backed one
    control: ADR-023 §7 requires every ADR-019 §8 validation case to re-pass, plus a no-visible-behavior-change check for existing Host Integration Packages
  - risk: the SDK becomes a second, drifting identity/authorization implementation
    control: ADR-023 §4 requires OAuth/PKCE token handling to still terminate at the existing OidcWorkspaceContextIssuer seam, never a second verifier
  - risk: dependency weight reintroduces the exact concern ADR-019 raised
    control: ADR-023 §3 notes substantial overlap with already-accepted dependencies (ajv, ajv-formats, jose) and that the condition ADR-019 §6 set for revisiting is now met, not disregarded
approval:
  product_intent_preserved: true
  architecture_approved: true
  enablement_beyond_development: blocked_pending_GOV_012_evidence
