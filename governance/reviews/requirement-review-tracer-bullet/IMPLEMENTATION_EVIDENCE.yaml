  remaining_P0: 0
  remaining_P1: 0
  verified:
    - campaign definitions reject duplicate trial and attempt identities before dispatch
    - concurrency never exceeds the declared bound and completed results retain declaration order
    - cross-trial dependency versions must be present and identical
