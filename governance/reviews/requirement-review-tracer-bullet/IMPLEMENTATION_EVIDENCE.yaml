gate_evidence:
  G1_intent_and_definition:
    outcome: pass
    basis: accepted specifications, exact public contracts, schema-validated output, and preserved product invariants
  G2_authority_and_sandbox:
    outcome: partial
    passed:
      - integrity-bound Workspace context verification
      - issuer, audience, actor, Workspace, policy, permission, timestamp, and administrative-scope checks
      - fail-closed runtime start authorization
      - fail-closed authorization for every runtime read and control operation
      - exact permission and resource coverage checks on allow decisions
      - requirement-read authorization before retained Requirement resolution
      - cross-Workspace denial and evidence sanitization
    pending:
      - production OIDC verifier and internal policy adapter
      - production sandbox, cleanup, and destructive-effect tests
  G3_contract_and_determinism:
    outcome: partial
    passed:
      - strict TypeScript contracts and deterministic adapters
      - runtime state, idempotency, cancellation, event replay, budget, and isolation tests for the implemented surface
      - reasoning replay binds the full authorized request and enforces Tool and usage limits
      - evaluation rejects incomplete suites, duplicate trials, contradictory outcomes, and unresolved versions
      - versioned runtime envelopes and discriminated, evidence-bearing event payloads
      - SPEC-508 runtime-owned execute/result path with exact retained Agent, Skill, Tool, and input-resource authority
      - output, evidence-requirement, version, budget, cleanup, idempotency, terminal-result, and cross-Workspace runtime controls
      - observed usage retention on budget exhaustion and terminal timeout after deadline expiry
      - per-run single-writer reservation, cancellation precedence, and late-observation rejection
      - exact retained policy and used Skill/Tool version binding
      - full attempt-fact retention for failed validation and schema-valid results for every implemented terminal path
      - rejected high-consequence approval retains an authoritative blocked result
      - Requirement Review Skill execution through the runtime while preserving the separate QA verdict
      - SPEC-511 provider-neutral Interface with complete operation surface
      - scripted Evaluation Adapter common-envelope echo, operation-and-resource authorization and denial, canonical digest, idempotency, strict UTC deadline and late-result retention, capability, observation-only result, and fail-closed cleanup tests
      - single-trial Evaluation Campaign orchestration through SPEC-511 capability discovery, environment preparation, execution, evidence collection, and cleanup
      - pre-side-effect campaign identity, deadline, assertion-matrix, and exact-version validation
      - fail-closed Adapter response-envelope and environment-version verification
      - deterministic assertion Oracle preserves subject failures while provider, evidence, and cleanup failures remain non-subject and cannot recommend release
      - multi-trial coordinator validates the declared matrix before dispatch and retains results in declaration order
      - bounded parallel scheduling stops new sequential dispatch after observed cancellation
      - trial-run identity, Workspace, subject, suite, cleanup, and cross-trial version integrity fail closed before aggregate recommendation
      - provider-neutral retained campaign repository contract with immutable Workspace-scoped snapshots and attributable events
      - canonical lifecycle and trial transitions use optimistic revisions, idempotent commands, and exact-version readiness checks
      - recovery resumes only retained pending work after all checks pass and blocks active unknown work instead of silently rerunning it
      - PostgreSQL record-store transaction adapter retains the campaign mutation, domain event, idempotent command result, and SPEC-505 outbox intent atomically
      - concurrent same-command winners resolve to the retained result while stale revisions and conflicting digests remain distinct
      - corrupt retained JSONB and outbox transaction failures fail closed without returning authoritative campaign state
      - a real pg-driver PgTransactionManager proves the same shared record-store contract suite, a concurrent-writer race producing exactly one winner and one stale_revision loser, Row-Level Security denying an unscoped query under a non-superuser application role, and state surviving a fresh transaction manager (restart-equivalent) against a live local PostgreSQL 18 server
      - SPEC-511 Evaluation Adapter conformance now covers cancellation (stable non-retryable failure), replay divergence (achieved_fidelity and divergences reported explicitly, never silently matching), replay_unavailable, and trial isolation (one trial cannot observe or receive another trial's scripted case) against ScriptedEvaluationAdapter
      - a parallel AgentRunRecordStore seam and SqliteAgentRunRecordStore give Agent Run state (SPEC-410 §5) the same contract-tested optimistic-revision, idempotent-replay, and Workspace-denial guarantees the Evaluation Campaign record-store already had
      - AP-064 context/cost-efficiency reuse is implemented (WorkingMemoryKnowledgeSearch) and proven against the real AssessRequirementQuality module: two reviews of the same requirement in one run query the Knowledge Store once, and a changed durable reference forces re-resolution
    pending:
      - SPEC-511 production Evaluation Adapter and shared production/deterministic conformance execution
      - PostgreSQL outbox-claim, worker-loss, backup/restore, and production-migration conformance; OIDC/internal authorization for the database connection itself
      - InMemoryAgentRuntime is not yet composed to write through AgentRunRecordStore — the seam and SQLite adapter exist and pass contract tests, but the runtime still holds authoritative state only in process memory
      - process-restart, timeout, no-progress, cleanup, and partial-effect execution paths beyond the in-memory recovery-decision baseline
  G4_evaluation_readiness:
    outcome: partial
    passed:
      - immutable suite policy checks and critical invariants
      - minimum trial enforcement prevents premature release recommendation
      - subject and non-subject failure attribution
      - trusted evidence-verifier boundary prevents caller-fabricated favorable trials
      - the collected-evidence integrity and provenance verification boundary precedes deterministic assertion facts
      - critical negative observations dominate the trial and cleanup failure overrides favorable observations
      - critical invariants aggregate across every executed trial and cannot be averaged away
      - cross-trial version divergence or absence produces an indeterminate campaign
    pending:
      - complete evaluation dataset and repeated trials
      - holdout, contamination, robustness, security, recovery, and load campaigns
  G5_regression_and_release_recommendation:
    outcome: not_started
  G6_controlled_release_and_monitoring:
    outcome: not_started
