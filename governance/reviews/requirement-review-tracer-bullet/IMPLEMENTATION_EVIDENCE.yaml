retained_campaign_repository_increment_review:
  outcome: pass
  reviewer: Codex implementation and specification-conformance review
  remaining_P0: 0
  remaining_P1: 0
  verified:
    - the provider-neutral repository seam is independent of PostgreSQL and the canonical lifecycle is shared without core-to-adapter dependency
    - campaign records and events are immutable, Workspace-scoped, attributable, and monotonically revised
    - create, transition, trial-boundary, and recovery commands bind idempotency keys to canonical request input
    - stale writers cannot change retained campaign or trial state
    - only canonical campaign and trial transitions are accepted and terminal campaign states cannot reopen
    - readiness fails while subject, suite, or any governed dependency version is unresolved
    - state changes require evidence references and exact trial and attempt identities
    - recovery validates pinned versions, evaluator health, leases, isolation, and cleanup before returning pending work
    - active trials requiring reconciliation block the campaign and remaining pending trials become not_executed; no automatic rerun is claimed
    - identical campaign identities remain isolated across Workspaces
  explicit_non_claims:
    - the in-memory adapter does not provide durable PostgreSQL or transactional-outbox guarantees
    - process crash/restart, multi-process concurrency, OIDC authorization, Judge orchestration, and production adapter conformance remain pending
postgres_campaign_store_increment_review:
  outcome: pass
  reviewer: Codex implementation and specification-conformance review
  remaining_P0: 0
  remaining_P1: 0
  verified:
    - the store interface hides SQL tables and transaction ordering from repository callers
    - one transaction scopes the Workspace before reading or writing campaign state
    - campaign snapshot, append-only event, command result, and outbox intent succeed or fail together
    - exact command replay returns the originally retained result without duplicate writes
    - a concurrent same-command winner is re-read after a lost compare-and-set and cannot become a false stale failure
    - JSONB identity and lifecycle shape are checked before database state becomes authoritative domain state
    - governed event kinds, sequential event revisions, trial definitions, and snapshot trial identities are verified while decoding JSONB
    - outbox integrity metadata is computed from the canonical payload inside the adapter and cannot be supplied by the caller
    - unknown runtime mutation kinds fail as invalid_request before a database transaction begins
    - PostgreSQL migration defines composite Workspace keys, forced RLS, optimistic revision fields, append-only event and command keys, and publisher indexes
    - up/down migration syntax and rollback passed a temporary PostgreSQL 14 smoke-test
  explicit_non_claims:
    - the local smoke-test is not PostgreSQL 18 production conformance
    - no production driver, deployed database, real concurrent connection, RLS-role, outbox publisher, backup/restore, worker-loss, or restart evidence is claimed
real_postgresql_driver_and_memory_increment_review:
  outcome: pass
  reviewer: Codex implementation and specification-conformance review
  remaining_P0: 0
  remaining_P1: 0
  verified:
    - a real pg-driver PgTransactionManager (not a fake) passes the full shared record-store contract suite against a live local PostgreSQL 18 server
    - a concurrent-writer race on the same campaign revision produces exactly one succeeded mutation and one stale_revision failure, never a silent overwrite
    - Row-Level Security denies an unscoped query when the connecting role is not a superuser; PostgreSQL superusers bypass RLS even under FORCE ROW LEVEL SECURITY, so this test specifically exercises a non-superuser application role to have any evidentiary value
    - retained state is readable through a newly constructed PgTransactionManager with no shared in-process state, standing in for a parent-runtime restart
    - a new AgentRunRecordStore seam and SqliteAgentRunRecordStore pass the same optimistic-revision, idempotent-replay, not_found, and cross-Workspace-denial contract suite already proven for the Evaluation Campaign record-store
    - SPEC-511 conformance now includes cancellation, replay (success, divergence, and replay_unavailable), and trial isolation cases against ScriptedEvaluationAdapter, closing gaps the ROADMAP previously listed as outstanding
    - WorkingMemoryKnowledgeSearch (SPEC-108 §4.1, AP-064) reuses a Knowledge Store result within a run when durable references are unchanged, and re-resolves when any of them change; proven both in isolation and against the real AssessRequirementQuality module
    - SessionMemory (SPEC-108 §7) declines retention by default and only promotes low-consequence, project-scoped, provenance-bearing, reuse-likely candidates through the fast path; medium/high-consequence and cross-project candidates are explicitly declined rather than silently retained
  explicit_non_claims:
    - InMemoryAgentRuntime does not yet write through AgentRunRecordStore; the seam exists and is contract-tested but is not composed into the runtime's authoritative write path
    - no Postgres adapter exists yet for Agent Run state (SQLite only, consistent with ADR-017's local-first default)
    - Session Memory's fast-path promotion has no consumer wired into the Requirement Review Skill yet (no real failure-avoidance candidate is generated by assess-requirement-quality.ts); the component is implemented and tested in isolation and via the Working Memory integration test, not yet exercised end-to-end for a save-decision candidate
    - production OIDC verifier, SPEC-511 production Evaluation Adapter, and PostgreSQL outbox-claim/worker-loss/backup conformance remain unimplemented, as recorded above
